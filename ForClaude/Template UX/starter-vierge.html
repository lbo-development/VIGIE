<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>[Nom de l'application] — GPMM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gpmm.css" />
</head>
<body>
  <!-- Bibliothèque d'icônes SVG locale — voir icons.svg pour la liste complète (35 icônes, nomenclature #i-xxx) -->
  <svg class="svg-sprite" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10M9 20v-6h6v6"/></symbol>
      <symbol id="i-ship" viewBox="0 0 24 24"><path d="M4 17h16l-2 3H6l-2-3zM6 17l1-7h10l1 7M9 10V6h6v4M12 6V3"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14 6l4-4 4 4-4 4M13 7L4 16l4 4 9-9M3 21l3-1-2-2-1 3z"/></symbol>
      <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5h10v16M14 9h6v12M8 9h2M8 13h2M8 17h2M17 13h1M17 17h1"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6M16 7a3 3 0 0 1 3 3M17 14c3 .3 4 2.3 4 5"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3z"/><path d="M9 12l2 2 4-4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/><path d="M3 9h18"/></symbol>
      <symbol id="i-fire" viewBox="0 0 24 24"><path d="M13 3s1 4-2 6c-2 1.5-3 3.5-3 5.5A4.5 4.5 0 0 0 12.5 19c2.5 0 4.5-2 4.5-4.5 0-2-1-3.5-2.5-5 .1 2-1 3-2 3.5.5-3-1-5-1-5S9 10 9 13"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7a7 7 0 0 0-.8-1.8l.9-1.9-2.2-2.2-1.9.9A7 7 0 0 0 11.5 4L10.5 2h-3L6.8 4a7 7 0 0 0-1.8.8l-1.9-.9L.9 6.1 1.8 8a7 7 0 0 0-.8 1.8L-1 10.5v3l2 .7a7 7 0 0 0 .8 1.8l-.9 1.9 2.2 2.2 1.9-.9a7 7 0 0 0 1.8.8l.7 2h3l.7-2a7 7 0 0 0 1.8-.8l1.9.9 2.2-2.2-.9-1.9a7 7 0 0 0 .8-1.8z" transform="translate(2 0) scale(.85)"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v1M12 20v1M3 12h1M20 12h1M5.6 5.6l.7.7M17.7 17.7l.7.7M18.4 5.6l-.7.7M6.3 17.7l-.7.7"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 6 2 8H4c0-2 2-2 2-8M10 20h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></symbol>
      <symbol id="i-selector" viewBox="0 0 24 24"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
      <symbol id="i-info-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12v4M12 8h.01"/></symbol>
      <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16 4l4 4L8 20H4v-4z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></symbol>
      <symbol id="i-grip-vertical" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="15" cy="18" r="1.3"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878"/></symbol>
    </defs>
  </svg>

  <div class="app-shell" id="appShell">
    <header class="app-header">
      <div class="brand-block">
        <img src="logo-gpmm.png" alt="Marseille Fos" class="brand-logo" />
        <span class="brand-separator" aria-hidden="true"></span>
        <span class="app-name">[Nom de l'application]</span>
      </div>

      <div class="header-tabs-shell" id="headerTabsShell">
        <button type="button" class="tabs-scroll-btn tabs-scroll-btn--left" id="tabsScrollLeft" aria-label="Afficher les onglets précédents" hidden>
          <svg class="ti"><use href="#i-chevron-left"></use></svg>
        </button>
        <nav class="header-tabs gp-tabs" id="headerTabs" aria-label="Modules de l'application" tabindex="0">
          <button class="gp-tab" aria-selected="true" data-main-tab="accueil">Accueil</button>
          <button class="gp-tab" aria-selected="false" data-main-tab="module-2">Module 2</button>
          <button class="gp-tab" aria-selected="false" data-main-tab="module-3">Module 3</button>
        </nav>
        <button type="button" class="tabs-scroll-btn tabs-scroll-btn--right" id="tabsScrollRight" aria-label="Afficher les onglets suivants" hidden>
          <svg class="ti"><use href="#i-chevron-right"></use></svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="content-area" aria-label="Contenu principal">
        <div class="page-heading">
          <div>
            <div class="breadcrumbs"><span>[Nom de l'application]</span><span>/</span><strong>Accueil</strong></div>
            <h1>Titre de la page</h1>
            <p>Description courte de la page ou de son objectif.</p>
          </div>
          <div class="page-actions">
            <button class="gp-btn gp-btn--secondary"><svg class="ti"><use href="#i-download"></use></svg>Exporter</button>
            <button class="gp-btn gp-btn--primary"><svg class="ti"><use href="#i-plus"></use></svg>Nouveau</button>
          </div>
        </div>

        <!-- Zone de contenu à remplir : cf. gpmm-style-guide.html pour tous les composants disponibles
             (boutons, champs, listbox, combobox, tableau triable, modales, toasts, onglets, tooltips,
             slicers, spin buttons) et GUIDELINES.md pour les règles d'usage. -->

      </section>

      <aside class="app-sidebar" id="appSidebar" aria-label="Navigation principale latérale">
        <nav class="sidebar-nav gp-scroll">
          <a href="#" class="sidebar-item is-active" data-label="Accueil"><svg class="ti"><use href="#i-home"></use></svg><span class="sidebar-label">Accueil</span></a>

          <div class="menu-group">
            <button class="sidebar-item menu-trigger" aria-expanded="false"><svg class="ti"><use href="#i-folder"></use></svg><span class="sidebar-label">Section</span><svg class="ti menu-chevron"><use href="#i-chevron-down"></use></svg></button>
            <div class="submenu"><a href="#">Sous-élément 1</a><a href="#">Sous-élément 2</a></div>
          </div>
        </nav>

        <div class="sidebar-footer">
          <button type="button" class="sidebar-footer-action" title="Paramètres"><svg class="ti"><use href="#i-settings"></use></svg><span class="sidebar-label">Paramètres</span></button>
          <span class="sidebar-footer-separator" aria-hidden="true"></span>
          <button type="button" class="sidebar-footer-action theme-toggle" id="themeToggle" title="Changer de thème" aria-pressed="false"><svg class="ti"><use id="themeIconUse" href="#i-moon"></use></svg><span class="sidebar-label" id="themeLabel">Sombre</span></button>
        </div>
      </aside>

      <button type="button" class="sidebar-rail-toggle" id="sidebarRailToggle" aria-controls="appSidebar" aria-expanded="true" aria-label="Escamoter la navigation">
        <svg class="ti"><use id="sidebarRailIconUse" href="#i-chevron-left"></use></svg>
      </button>
    </main>

    <footer class="status-bar" role="status">
      <div class="status-left"><span class="status-dot"></span><span>[Nom de l'application]</span><span class="status-sep">•</span><span>Environnement Production</span></div>
      <div class="status-right"><span>Connecté</span><span class="status-sep">•</span><span class="mono">v1.0.0</span><span class="status-sep">•</span><span>Utilisateur</span></div>
    </footer>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  </div>

  <!-- Région des toasts : générée automatiquement par app.js si absente. -->
  <div class="gp-toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
