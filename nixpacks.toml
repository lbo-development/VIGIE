# Ajoute LibreOffice (headless) à l'image de build Railway — nécessaire à
# backend/src/pdf/fadPdfGenerator.ts (génération de la fiche FAD papier, décision du
# 19/09/2026) : le backend convertit un classeur Excel rempli en PDF via
# `soffice --headless --convert-to pdf`, en tant que sous-processus du serveur Node.
#
# ATTENTION — non vérifié sur ce projet : le nom de paquet Nix "libreoffice" et la syntaxe
# `[phases.setup]`/`nixPkgs` correspondent à la doc Nixpacks au moment de l'écriture, mais
# n'ont jamais été testés sur un déploiement Railway réel de VIGIE. À valider sur un déploiement
# de test (taille d'image/temps de build fortement accrus — LibreOffice est un paquet volumineux)
# avant de considérer la génération de fiche FAD comme fonctionnelle en production.
[phases.setup]
nixPkgs = ["libreoffice"]
