# Ajoute LibreOffice (headless) à l'image de build Railway — nécessaire à
# backend/src/pdf/fadPdfGenerator.ts (génération de la fiche FAD papier, décision du
# 19/09/2026) : le backend convertit un classeur Excel rempli en PDF via
# `soffice --headless --convert-to pdf`, en tant que sous-processus du serveur Node.
#
# IMPORTANT : déclarer `[phases.setup]` remplace entièrement la détection automatique de
# Nixpacks (Node.js/npm inclus) au lieu de s'y ajouter — nodejs_22 doit donc être listé
# explicitement ici, sinon `npm ci` échoue avec "npm: command not found" (constaté au
# déploiement du 19/09/2026). Version alignée sur "engines.node" du package.json racine (>=22).
[phases.setup]
nixPkgs = ["nodejs_22", "libreoffice"]
